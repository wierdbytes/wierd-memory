# Checks every push to main, and publishes @wierdbytes/pi-memory to npm when the version in
# packages/pi/package.json is not on npm yet (bump it and its CHANGELOG.md entry to release).
#
# IMPORTANT: the filename of this workflow (`publish.yml`) is registered on npmjs.com as the package's
# Trusted Publisher (npm trust github … --file publish.yml). If you rename this file, update the Trusted
# Publisher on npmjs.com to match, otherwise `npm publish` fails the OIDC handshake with a 404.
#
# What is published is packages/pi/dist, built by `bun run build:pi` (scripts/build-pi.ts): the extension
# bundled with @wierd-memory/core inlined, and its own package.json. packages/pi/package.json itself is private.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run for any commit

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test # needs git (preinstalled on the runner); the tests set their own git identity
      - run: bun run build:pi
      - run: npm pack --dry-run ./packages/pi/dist

  detect:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.scan.outputs.publish }}
      version: ${{ steps.scan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - id: scan
        name: Is the local version of @wierdbytes/pi-memory on npm yet?
        run: |
          set -euo pipefail
          name="@wierdbytes/pi-memory"
          version=$(jq -r .version packages/pi/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if out=$(npm view "$name@$version" version 2>err.txt) && [ "$out" = "$version" ]; then
            echo "= $name@$version is on npm, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q E404 err.txt; then
            echo "+ $name@$version is not on npm, will publish"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat err.txt
            echo "::error::could not ask npm about $name@$version"
            exit 1
          fi

  publish:
    needs: [check, detect]
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC (Trusted Publishing); npm adds provenance on its own
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # OIDC requires npm >= 11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run build:pi
      - name: Check the manifest
        run: |
          set -euo pipefail
          test "$(jq -r .version packages/pi/dist/package.json)" = "${{ needs.detect.outputs.version }}"
          if grep -q 'workspace:' packages/pi/dist/package.json || grep -q '@wierd-memory/' packages/pi/dist/index.js; then
            echo "::error::packages/pi/dist must not depend on the workspace"; exit 1
          fi
      - name: Publish
        run: npm publish ./packages/pi/dist
